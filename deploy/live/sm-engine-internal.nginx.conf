# Sidemoney payment engine — headless WordPress, internal only. Reachable
# ONLY via the main sidemoney.co vhost, which proxies the carved WooPayments
# and Jetpack paths here. Never exposed on its own hostname.
server {
    listen 127.0.0.1:8088;
    server_name sidemoney.co;
    root /var/www/pay;
    index index.php;
    client_max_body_size 32m;

    location = /xmlrpc.php { return 410; }
    location ~ /\.(git|ht) { return 444; }

    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 60s;
    }
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|woff2?)$ { try_files $uri =404; expires 7d; access_log off; }
}
