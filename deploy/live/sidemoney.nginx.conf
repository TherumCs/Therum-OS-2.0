upstream therum_api   { server 127.0.0.1:10009; keepalive 32; }
upstream therum_admin { server 127.0.0.1:3100;  keepalive 32; }
upstream therum_pay   { server 127.0.0.1:8088;  keepalive 8; }

server {
    server_name sidemoney.co www.sidemoney.co;

    # gzip_proxied any is the line that matters: without it nginx will not
    # compress a proxied response, and every page here is proxied.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml text/javascript
               application/javascript application/json application/xml
               application/rss+xml image/svg+xml font/ttf font/otf;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\" \"https://www.paypal.com\"), interest-cohort=()" always;

    client_max_body_size 25m;

    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    include /etc/nginx/snippets/wp-assets.conf;

    location /api/uploads/ {
        proxy_pass http://therum_api;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Re-declared, not inherited: a block with its own add_header loses
        # every inherited one. These are shopper-uploaded files, so nosniff is
        # the header that matters most on this path.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        # An uploaded file is never a document that should run anything.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    # Sign-in surfaces: the ones worth brute-forcing.
    location ~ ^/tos-admin/api/auth/(login|setup|verify-2fa|change-password) {
        limit_req zone=therum_auth burst=5 nodelay;
        limit_conn therum_conn 10;
        proxy_pass http://therum_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tos-admin {
        proxy_pass http://therum_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # The partner approval screen renders from the session cookie, so the
    # server-level `Cache-Control: public` must not apply to it. An add_header
    # at THIS level cancels the inherited ones (nginx inherits add_header only
    # when a level defines none), so the security headers are restated here.
    location /wc-auth {
        limit_req zone=therum_auth burst=5 nodelay;
        limit_conn therum_conn 10;
        proxy_pass http://therum_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store, max-age=0, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\" \"https://www.paypal.com\"), interest-cohort=()" always;
    }

    include snippets/sm-legacy.conf;


    # ── WooPayments engine (headless WordPress, internal upstream) ──
    # Only these paths hit the engine; the vendor bridge (/wp-json/wc/v3/*),
    # /api, /wp-content/uploads and the whole storefront stay on the app.
    location ^~ /wp-json/wc/v3/payments { proxy_pass http://therum_pay; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location ^~ /wp-json/jetpack        { proxy_pass http://therum_pay; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location ^~ /wp-content/plugins/woocommerce { proxy_pass http://therum_pay; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

    location / {
        proxy_pass http://therum_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sidemoney.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sidemoney.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}


server {
    if ($host = www.sidemoney.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = sidemoney.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name sidemoney.co www.sidemoney.co;
    return 404; # managed by Certbot




}