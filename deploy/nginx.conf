# Therum CMS 2.0 — nginx reverse proxy (Ubuntu 24). Place in /etc/nginx/sites-available,
# symlink to sites-enabled, then `nginx -t && systemctl reload nginx`. Add TLS via certbot.

upstream therum_api   { server 127.0.0.1:4100; keepalive 32; }
upstream therum_admin { server 127.0.0.1:3100; keepalive 32; }

# Public API
server {
  listen 80;
  server_name api.therum.example;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 10m;

  location / {
    proxy_pass http://therum_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
  }
}

# Storefront (Counter C4) — bare / on the main site host. Server-rendered by
# the same Fastify process as the API, so one upstream serves pages AND /api.
server {
  listen 80;
  server_name shop.therum.example;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    proxy_pass http://therum_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
  }
}

# Admin dashboard (lock down by IP / auth at the edge in production)
server {
  listen 80;
  server_name admin.therum.example;

  location / {
    proxy_pass http://therum_admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
