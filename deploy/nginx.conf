# Therum CMS 2.0 — nginx reverse proxy (Ubuntu 24). Place in /etc/nginx/sites-available,
# symlink to sites-enabled, then `nginx -t && systemctl reload nginx`. Add TLS via certbot.
#
# ── COMPRESSION ────────────────────────────────────────────────────────────
#
# Responses are compressed HERE, at the edge, not in the application. That is
# the conventional split and it is also the one that works: adding
# @fastify/compress to the app set Content-Encoding and then emptied every
# response — the onSend chain ran twice and the payload was gone on the second
# pass, so pages arrived as 0 bytes. nginx has no such interaction, costs the
# Node process nothing, and compresses the static uploads too.
#
# The numbers on this site, measured:
#   ported theme stylesheet   1,182,399 -> ~170,000  (85% off, loads on EVERY page)
#   /shop                       166,909 ->  ~40,000  (76% off)
#   /                           115,609 ->  ~29,000  (75% off)
#
# `gzip_proxied any` is the line that matters for a reverse proxy — without it
# nginx will not compress a response it received from an upstream, which is
# every response here. text/html is compressed whenever gzip is on and must
# NOT be listed in gzip_types (nginx rejects the config if it is).
#
# For brotli (another ~10-20% on top) the stock Ubuntu nginx needs the
# ngx_brotli module; add `brotli on; brotli_comp_level 5; brotli_types …;`
# alongside these once it is installed.

upstream therum_api   { server 127.0.0.1:4100; keepalive 32; }
upstream therum_admin { server 127.0.0.1:3100; keepalive 32; }

# Public API
server {
  listen 80;

  # See the compression note at the top of this file.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/css text/plain text/xml text/javascript
    application/javascript application/json application/xml application/rss+xml
    application/vnd.ms-fontobject font/ttf font/otf image/svg+xml;
  server_name api.therum.example;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 10m;

  location / {
    proxy_pass http://therum_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
  }
}

# Storefront (Counter C4) — bare / on the main site host. Server-rendered by
# the same Fastify process as the API, so one upstream serves pages AND /api.
server {
  listen 80;

  # See the compression note at the top of this file.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/css text/plain text/xml text/javascript
    application/javascript application/json application/xml application/rss+xml
    application/vnd.ms-fontobject font/ttf font/otf image/svg+xml;
  server_name shop.therum.example;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    proxy_pass http://therum_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
  }
}

# Admin dashboard (lock down by IP / auth at the edge in production)
server {
  listen 80;

  # See the compression note at the top of this file.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/css text/plain text/xml text/javascript
    application/javascript application/json application/xml application/rss+xml
    application/vnd.ms-fontobject font/ttf font/otf image/svg+xml;
  server_name admin.therum.example;

  location / {
    proxy_pass http://therum_admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
